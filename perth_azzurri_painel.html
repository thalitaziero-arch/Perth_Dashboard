<!DOCTYPE html>

<head>

<title>Perth Azzurri</title>
<style>

  svg { width: 64px; height: 72px; margin-bottom: 24px; opacity: .9; }
  h1 { font-family: Georgia, serif; font-size: 1.4rem; letter-spacing: .12em;
       text-transform: uppercase; margin-bottom: 8px; }
  h1 span { color: #D62E2E; }

</head>
<body>
<div class="wrap">

  <h1>Perth <span>Azzurri</span></h1>
  <p>Em manutenção</p>
</div>

</html>
